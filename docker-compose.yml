version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: stock_db
    restart: always
    environment:
      MYSQL_DATABASE: stock_db
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  backend:
    build: ./stock-management/backend
    container_name: stock_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/stock_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - JWT_SECRET=StockManagerSaaSPremiumSecretKey2026!#$
      - JWT_EXPIRATION=86400000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./stock-management/frontend
    container_name: stock_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  mysql_data:
